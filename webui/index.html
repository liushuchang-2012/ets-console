<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ETS 控制台</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel2:#0f151d; --line:#1f2937; --line2:#273244;
    --fg:#e6edf3; --muted:#8b96a5; --dim:#5b6675;
    --green:#3fb950; --green-dim:#1f6f34; --amber:#d29922; --red:#f85149; --blue:#58a6ff;
    --radius:14px;
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 700px at 85% -10%, #16202e 0%, var(--bg) 55%) fixed;
    color:var(--fg); font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--blue)}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:1560px;margin:0 auto;padding:22px 24px 120px}

  /* header */
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:19px;margin:0;letter-spacing:.4px;font-weight:650}
  .brand .sub{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
    background:var(--panel);padding:7px 12px;border-radius:999px;color:var(--muted);font-size:12.5px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
  .dot.ok{background:var(--green);box-shadow:0 0 10px rgba(63,185,80,.55)}
  .dot.bad{background:var(--red);box-shadow:0 0 10px rgba(248,81,73,.5)}
  .dot.wait{background:var(--amber);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .ghost{background:transparent;border:1px solid var(--line2);border-radius:10px;padding:7px 13px;color:var(--muted);transition:.16s}
  .ghost:hover{color:var(--fg);border-color:#3d4d63;background:#151d27}
  .ghost:disabled{opacity:.45;cursor:not-allowed}

  /* cards */
  .card{background:linear-gradient(180deg,#131a24,#10161f);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 40px rgba(0,0,0,.25)}
  .pad{padding:16px 18px}

  /* toolbar */
  .bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:14px}
  .field{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}
  .field b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
  input[type=number],input[type=text]{background:#0b1118;border:1px solid var(--line2);color:var(--fg);border-radius:9px;
    padding:7px 10px;width:78px;outline:none;font-variant-numeric:tabular-nums}
  input[type=text]{width:100%}
  input:focus{border-color:#3b82f6aa;box-shadow:0 0 0 3px #1d4ed822}
  input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--green) var(--fill,66%),#2b3648 var(--fill,66%));width:132px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#e6edf3;box-shadow:0 0 0 4px #3fb95033;cursor:pointer}
  .check{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
  .check input{accent-color:var(--green);width:14px;height:14px}
  .primary{background:linear-gradient(180deg,#2ea043,#1f7a33);border:1px solid #2ea043;border-radius:10px;padding:8px 16px;
    font-weight:600;color:#fff;transition:.16s;box-shadow:0 6px 18px rgba(46,160,67,.18)}
  .primary:hover{filter:brightness(1.08)}
  .primary:disabled{filter:grayscale(.6);opacity:.5;cursor:not-allowed;box-shadow:none}
  .danger{color:#ffb4ae;border-color:#5a2a29;background:#2a1717}
  .danger:hover{background:#3a1c1b;border-color:#7a3a38;color:#ffd7d3}

  /* main grid */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  .side{position:sticky;top:20px}
  @media (max-width:960px){.grid{grid-template-columns:1fr}}

  /* tabs */
  .tabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
  .tab{padding:7px 13px;border-radius:9px;color:var(--muted);border:1px solid transparent;background:transparent;font-size:13.5px;transition:.15s}
  .tab:hover{color:var(--fg);background:#18212d}
  .tab.on{color:var(--fg);background:#1b2533;border-color:#2b3a4d}
  .tab .n{color:var(--dim);font-size:12px;margin-left:5px;font-variant-numeric:tabular-nums}
  .tab.on .n{color:var(--green)}
  .search{padding:10px 12px;border-bottom:1px solid var(--line)}
  .search input{background:#0b1118;border:1px solid var(--line2);border-radius:9px;padding:8px 12px;color:var(--fg);width:100%;outline:none}
  .search input:focus{border-color:#3b82f6aa}

  /* table */
  .table{width:100%;border-collapse:collapse;table-layout:fixed}
  .table col.c-score{width:108px}
  .table col.c-pct{width:168px}
  .table col.c-time{width:92px}
  .table col.c-ops{width:222px}
  .table th{text-align:left;font:500 12px/1 system-ui;color:var(--dim);letter-spacing:.5px;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  .table th.r,.table td.r{text-align:right}
  .table th,.table td{white-space:nowrap}
  .table td{padding:9px 14px;border-bottom:1px solid #182130;vertical-align:middle}
  .table thead th{position:sticky;top:0;background:#121a24;z-index:3}
  .table td:first-child{white-space:normal}
  .table .meta{font-size:11.5px;margin-top:2px}
  .table tr:last-child td{border-bottom:none}
  .table tbody tr{transition:background .14s}
  .table tbody tr:hover{background:#141c26}
  .name{font-weight:550;color:var(--fg);display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
  .name .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;min-width:0}
  .name .meta{color:var(--dim);font-size:12px;font-weight:400}
  .tag{font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--muted);background:#101822;white-space:nowrap;flex:none;line-height:1.5}
  .tag.over{color:#f0b429;border-color:#4a3a12;background:#241d0c}
  .tag.good{color:#56d364;border-color:#1f5130;background:#0f2417}
  .score{font-variant-numeric:tabular-nums;font-weight:650;font-size:15px}
  .score small{font-weight:400;color:var(--dim);font-size:11.5px}
  .score.hi{color:var(--green)}
  .muted{color:var(--muted)}
  .nowrap{display:inline-flex;align-items:center;white-space:nowrap}
  .bar-mini{height:5px;background:#1b2431;border-radius:3px;overflow:hidden;width:74px;display:inline-block;vertical-align:middle;margin-right:8px}
  .bar-mini i{display:block;height:100%;background:linear-gradient(90deg,#2ea043,#56d364);border-radius:3px}
  .acts{display:flex;gap:7px;justify-content:flex-end;flex-wrap:nowrap}
  .mini{border:1px solid var(--line2);background:#131b25;border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--muted);transition:.15s;white-space:nowrap}
  .mini:hover{color:var(--fg);border-color:#3d5a43;background:#16211a;color:#7ee2a8}
  .mini.plain:hover{border-color:#3d4d63;background:#18212d;color:var(--fg)}
  .mini:disabled{opacity:.4;cursor:not-allowed}
  .empty{padding:44px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:26px;opacity:.5;margin-bottom:8px}
  .skeleton{height:44px;margin:10px 14px;border-radius:9px;background:linear-gradient(90deg,#141b25,#1b2533,#141b25);background-size:200% 100%;animation:sk 1.3s infinite}
  @keyframes sk{to{background-position:-200% 0}}

  /* right column */
  .side{display:flex;flex-direction:column;gap:14px}
  .card h3{margin:0;font-size:13px;letter-spacing:.4px;color:var(--muted);font-weight:600}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:13px;margin-top:12px}
  .kv .k{color:var(--dim)}
  .kv .v{color:var(--fg);text-align:right;word-break:break-all}
  .logbox{padding:0;overflow:hidden}
  .logbox .head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
  .log{height:230px;overflow:auto;margin:0;padding:12px 14px;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:#9fb0c3;white-space:pre-wrap;word-break:break-all;background:#0a1017}
  .log .ok{color:#56d364}.log .err{color:#ff8b84}.log .ts{color:#4b5a6d}

  /* modal */
  .mask{position:fixed;inset:0;background:#0008;backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .mask.on{display:flex}
  .modal{width:min(1020px,100%);max-height:86vh;overflow:auto;background:linear-gradient(180deg,#151d28,#10161f);border:1px solid #26344a;border-radius:16px;box-shadow:0 30px 90px #000a}
  .modal .head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#141c27;z-index:2}
  .modal .head h2{font-size:16px;margin:0;font-weight:650}
  .modal .body{padding:18px 20px 24px}
  .modal .close{margin-left:auto;background:transparent;border:1px solid var(--line2);border-radius:9px;padding:6px 10px;color:var(--muted)}
  .modal .close:hover{color:var(--fg)}
  .sect{margin-top:18px}
  .sect h4{margin:0 0 9px;font-size:12.5px;color:var(--dim);font-weight:600;letter-spacing:.5px}
  .itemgrid{display:grid;grid-template-columns:1fr;gap:8px}
  .itemrow{border:1px solid var(--line);background:#0f1620;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
  .itemrow code{font:12px ui-monospace,Consolas,monospace;color:#9fb0c3}
  .itemrow .t{color:var(--dim);font-size:11.5px}
  pre.raw{background:#0a1017;border:1px solid var(--line);border-radius:10px;padding:12px;font:11.5px/1.55 ui-monospace,Consolas,monospace;color:#9fb0c3;max-height:380px;overflow:auto;margin:0}

  /* toast / busy */
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1b2533;border:1px solid #2e3f56;color:var(--fg);
    padding:11px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:.22s;z-index:60;box-shadow:0 12px 40px #000a;max-width:80vw}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.ok{border-color:#235f37;background:#0f2417}
  .toast.err{border-color:#6b2b28;background:#2a1717}
  .busy{position:fixed;inset:0;background:#060a0faa;backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:55;flex-direction:column;gap:14px}
  .busy.on{display:flex}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid #26313f;border-top-color:var(--green);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .busy .txt{color:var(--muted);font-size:13px}
  .foot{margin-top:16px;color:var(--dim);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
  .foot code{background:#131a24;border:1px solid var(--line);padding:2px 6px;border-radius:6px;font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>ETS 控制台</h1>
      <span class="sub">讯飞E听说 · 本地作业工具</span>
    </div>
    <div class="spacer"></div>
    <div class="pill" id="conn"><span class="dot" id="connDot"></span><span id="connText">检测中…</span></div>
    <button class="ghost" id="btnRefresh">刷新</button>
  </header>

  <section class="card pad bar" style="margin-bottom:14px">
    <div class="field">目标分
      <input type="range" id="pctRange" min="50" max="100" step="1" value="100" />
      <b id="pctVal">100%</b>
    </div>
    <div class="field">时长 <input type="number" id="timeVal" min="1" max="86400" value="120" /> 秒</div>
    <label class="check"><input type="checkbox" id="softChk" /> 随机抖动</label>
    <label class="check"><input type="checkbox" id="dryChk" /> 只看不发（dry-run）</label>
    <div class="spacer"></div>
    <button class="primary" id="btnTodo">一键刷「待做 + 逾期」</button>
  </section>

  <div class="grid">
    <section class="card" style="overflow:hidden">
      <div class="tabs">
        <button class="tab on" data-tab="1">待做 <span class="n" id="n1">0</span></button>
        <button class="tab" data-tab="2">已完成 <span class="n" id="n2">0</span></button>
        <button class="tab" data-tab="3">逾期 <span class="n" id="n3">0</span></button>
        <div class="spacer"></div>
        <span class="muted" style="font-size:12px" id="listHint"></span>
      </div>
      <div class="search"><input type="text" id="q" placeholder="搜索作业名称或 ID…" /></div>
      <div id="tableWrap">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </section>

    <aside class="side">
      <section class="card pad">
        <h3>账号 / 环境</h3>
        <div class="kv" id="account">
          <div class="k">状态</div><div class="v">—</div>
        </div>
      </section>
      <section class="card logbox">
        <div class="head"><h3>运行日志</h3><button class="mini plain" id="btnClearLog">清空</button></div>
        <pre class="log" id="log"></pre>
      </section>
    </aside>
  </div>

  <div class="foot">
    <span>核心：<code>src/ets.js</code></span>
    <span>前提：ETS 客户端已打开并登录</span>
    <span>关闭本页不影响 ETS</span>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="head"><h2 id="mTitle">作业详情</h2><button class="close" id="mClose">关闭</button></div>
    <div class="body" id="mBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="busy" id="busy"><div class="spin"></div><div class="txt" id="busyTxt">处理中…</div></div>

<script>
const $ = (s) => document.querySelector(s);
const state = { statuses:{1:[],2:[],3:[]}, counts:null, tab:1, q:"", ready:false, busy:false };
{ const t=new URLSearchParams(location.search).get("tab"); if(t && [1,2,3].includes(Number(t))) state.tab=Number(t); }

/* ---------------- 基础 ---------------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, kind, ms){
  const t=$("#toast"); t.textContent=msg; t.className="toast on "+(kind||"");
  clearTimeout(t._h); t._h=setTimeout(()=>t.className="toast "+(kind||""), ms||2600);
}
function logLine(text, kind){
  const el=$("#log"); const ts=new Date().toLocaleTimeString("zh-CN",{hour12:false});
  const span=document.createElement("div");
  span.className=kind||"";
  span.innerHTML='<span class="ts">'+ts+'</span>  '+esc(text);
  el.appendChild(span); el.scrollTop=el.scrollHeight;
  while(el.childNodes.length>300) el.removeChild(el.firstChild);
}
function setBusy(on, txt){
  state.busy=on; $("#busy").classList.toggle("on", on); $("#busyTxt").textContent=txt||"处理中…";
  document.querySelectorAll("button").forEach(b=>{ if(b.id!=="btnClearLog") b.disabled = on || b.dataset.needready==="1" && !state.ready; });
}
async function api(path, opts){
  const r = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, opts||{}));
  return await r.json();
}

/* ---------------- 渲染 ---------------- */
function rowsOf(tab){ return state.statuses[tab] || []; }
function filterRows(rows){
  const q=state.q.trim().toLowerCase();
  if(!q) return rows;
  return rows.filter(h=>String(h.id).includes(q) || (h.name||"").toLowerCase().includes(q));
}
function renderTabs(){
  for(const st of [1,2,3]){
    const n = (state.statuses[st]||[]).length;
    const c = state.counts && Number(state.counts[st]) ? Number(state.counts[st]) : n;
    $("#n"+st).textContent = c>n ? (n+" / "+c) : String(n);
  }
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", Number(b.dataset.tab)===state.tab));
}
function scoreCell(h){
  const p = h.point!==undefined && h.point!==null ? Number(h.point) : null;
  const tp = Number(h.total_point||100);
  if(p===null) return '<span class="muted">—</span>';
  const hi = p>=tp*0.9;
  return '<span class="score '+(hi?"hi":"")+'">'+(Math.round(p*10)/10)+'<small>/'+tp+'</small></span>';
}
function renderTable(){
  const wrap=$("#tableWrap");
  const rows=filterRows(rowsOf(state.tab)).slice().sort((a,b)=>Number(b.id)-Number(a.id));
  if(!state.ready){ wrap.innerHTML='<div class="empty"><div class="big">⚠</div>未连接到 ETS，请先启动客户端并登录，然后点右上角「刷新」。</div>'; return; }
  if(!rows.length){
    wrap.innerHTML='<div class="empty"><div class="big">✓</div>'+
      (state.q? "没有匹配「"+esc(state.q)+"」的作业。" : (state.tab===1? "没有待做的作业，干得漂亮。" : "这一类暂时是空的。"))+'</div>';
    return;
  }
  let html='<table class="table"><colgroup><col class="c-name"><col class="c-score"><col class="c-pct"><col class="c-time"><col class="c-ops"></colgroup>'
    +'<thead><tr><th>作业</th><th class="r">分数</th><th>完成度</th><th class="r">时长</th><th class="r">操作</th></tr></thead><tbody>';
  for(const h of rows){
    const pct = Number(h.complete||0);
    const over = h.expire==1 || h.overtime==1 || state.tab===3;
    const done = pct>=100;
    html+='<tr data-id="'+esc(h.id)+'">'
      +'<td><div class="name"><span class="ttl">'+esc(h.name||("作业 "+h.id))+'</span>'
      + (over?'<span class="tag over">逾期</span>':'')
      + (done?'<span class="tag good">已完成</span>':'')
      + '</div><div class="meta"><span class="muted">ID '+esc(h.id)+' · 资源 '+esc(h.resource_id)+'</span></div></td>'
      +'<td class="r">'+scoreCell(h)+'</td>'
      +'<td><span class="nowrap"><span class="bar-mini"><i style="width:'+Math.min(100,pct)+'%"></i></span><span class="muted">'+pct+'%</span></span></td>'
      +'<td class="r muted">'+(h.use_time!==undefined&&h.use_time!==null? h.use_time+"s":"—")+'</td>'
      +'<td class="r"><div class="acts">'
        +'<button class="mini plain" data-act="detail" data-id="'+esc(h.id)+'" data-rid="'+esc(h.resource_id)+'">详情</button>'
        +'<button class="mini" data-act="do" data-id="'+esc(h.id)+'" data-rid="'+esc(h.resource_id)+'" '+(done?'disabled title="已完成，分数已冻结"':'')+'>提交</button>'
        +'<button class="mini plain" data-act="time" data-id="'+esc(h.id)+'" data-rid="'+esc(h.resource_id)+'">时长</button>'
      +'</div></td></tr>';
  }
  html+='</tbody></table>';
  wrap.innerHTML=html;
}
function renderStatus(s){
  const dot=$("#connDot"), txt=$("#connText");
  if(s && s.ok){
    dot.className="dot "+(s.needsLogin?"wait":"ok");
    txt.textContent = s.needsLogin ? "已连接 · 未登录" : "已连接 · 端口 "+s.port;
    state.ready=true;
    const u=s.user||{};
    $("#account").innerHTML =
      '<div class="k">账号</div><div class="v">'+esc(u.name||"—")+'</div>'+
      '<div class="k">学校</div><div class="v">'+esc(u.school_name||"—")+'</div>'+
      '<div class="k">班级</div><div class="v">'+esc(u.class_name||"—")+' 班</div>'+
      '<div class="k">服务端时间</div><div class="v">'+esc(s.serverTime||"—")+'</div>'+
      '<div class="k">令牌</div><div class="v">'+(s.hasToken?"<span style='color:#56d364'>有效</span>":"<span style='color:#ff8b84'>缺失（请登录）</span>")+'</div>';
  } else {
    dot.className="dot bad"; txt.textContent="未连接 ETS";
    state.ready=false;
    $("#account").innerHTML =
      '<div class="k">状态</div><div class="v" style="color:#ff8b84">连接失败</div>'+
      '<div class="k">原因</div><div class="v" style="font-size:12px">'+esc((s&&s.error)||"未知")+'</div>'+
      '<div class="k">处理</div><div class="v" style="font-size:12px">打开并登录 ETS 后点刷新</div>';
  }
}

/* ---------------- 数据 ---------------- */
async function loadAll(silent){
  if(!silent) setBusy(true,"正在读取作业列表…");
  const t0=performance.now();
  const r=await api("/api/all");
  const ms=Math.round(performance.now()-t0);
  if(r.data && r.data.ok){
    state.statuses = r.data.statuses || {1:[],2:[],3:[]};
    state.counts = r.data.counts || null;
    state.ready=true;
    renderStatus(r.data);
    if(r.data.needsLogin){ toast("已连上 ETS，但还没登录 —— 请先在客户端里登录", "err", 5200); logLine("未登录：读不到账号信息（userInfo 为空）","err"); }
    else if(r.data.listError){ logLine("列表读取告警："+r.data.listError,"err"); }
    renderTabs(); renderTable(); $("#listHint").textContent="刷新于 "+new Date().toLocaleTimeString("zh-CN",{hour12:false})+" · "+ms+"ms";
    logLine("已刷新：待做 "+(state.statuses[1]||[]).length+" / 已完成 "+(state.statuses[2]||[]).length+" / 逾期 "+(state.statuses[3]||[]).length,"ok");
  } else {
    state.statuses={1:[],2:[],3:[]}; state.ready=false;
    renderStatus({ok:false,error:r.error});
    renderTabs(); renderTable();
    logLine("读取失败："+(r.error||"未知错误")+(r.log?("\\n"+r.log):""),"err");
    if(!silent) toast(r.error||"读取失败","err",4200);
  }
  if(!silent) setBusy(false);
}

/* ---------------- 操作 ---------------- */
function opts(){
  return {
    pct: Number($("#pctRange").value),
    time: Number($("#timeVal").value)||120,
    soft: $("#softChk").checked,
    dry: $("#dryChk").checked,
  };
}
async function submitOne(id, rid, btn){
  const o=opts();
  setBusy(true, (o.dry?"预览 ":"提交 ")+"作业 "+id+" …");
  logLine("提交 "+id+"（目标 "+o.pct+"%，时长 "+o.time+"s"+(o.dry?"，dry-run":"")+"）…");
  const r=await api("/api/do",{method:"POST",body:JSON.stringify(Object.assign({id,rid},o))});
  setBusy(false);
  handleDoResult(r, [id]);
}
function handleDoResult(r, ids){
  const d=r.data||{};
  if(r.log) r.log.split("\\n").forEach(l=>{ if(l.trim()) logLine(l, /失败|错误|9001/.test(l)?"err":""); });
  if(!r.ok){ toast("失败："+(d.error||r.error||"未知"),"err",5000); return; }
  const rs=d.results||[];
  const good=rs.filter(x=>x.ok).length;
  const skipped=rs.filter(x=>x.skipped).length;
  toast("完成：成功 "+good+"，跳过 "+skipped+"，失败 "+(rs.length-good-skipped), good>0?"ok":"", 4000);
  loadAll(true);
}
async function submitTodo(){
  const o=opts();
  const n=(state.statuses[1]||[]).length+(state.statuses[3]||[]).length;
  if(!n){ toast("没有待做或逾期的作业","",2400); return; }
  if(!confirm("将提交 "+(state.statuses[1]||[]).length+" 个待做 + "+(state.statuses[3]||[]).length+" 个逾期作业（目标 "+o.pct+"%）。\\n\\n已完成作业会自动跳过；整个流程可能持续几分钟。继续？")) return;
  setBusy(true,"批量提交中，请不要关闭页面…");
  logLine("批量提交开始：目标 "+o.pct+"%，时长 "+o.time+"s");
  const r=await api("/api/do",{method:"POST",body:JSON.stringify(Object.assign({todo:true},o))});
  setBusy(false);
  const d=r.data||{};
  if(r.log) r.log.split("\\n").forEach(l=>{ if(l.trim()) logLine(l, /失败|错误|9001/.test(l)?"err":""); });
  if(!r.ok){ toast("批量结束："+(d.error||r.error||"未知"),"err",6000); }
  else {
    const rs=d.results||[];
    const good=rs.filter(x=>x.ok).length, skip=rs.filter(x=>x.skipped).length;
    toast("批量完成：成功 "+good+"，跳过 "+skip+"，失败 "+(rs.length-good-skip),"ok",6000);
  }
  loadAll(true);
}
async function editTime(id, rid){
  const cur = (rowsOf(state.tab).find(x=>String(x.id)===String(id))||{}).use_time;
  const v = prompt("把作业 "+id+" 的学习时长改为多少秒？", cur||120);
  if(v===null) return;
  const sec=Number(v); if(!Number.isFinite(sec)||sec<=0){ toast("秒数不合法","err"); return; }
  setBusy(true,"修改时长…");
  const r=await api("/api/time",{method:"POST",body:JSON.stringify({id,rid,sec})});
  setBusy(false);
  if(r.ok){ toast("时长已改为 "+sec+"s","ok"); logLine("时长 "+id+" → "+sec+"s","ok"); loadAll(true); }
  else { toast("失败："+(r.error||"未知"),"err"); logLine("改时长失败："+(r.error||""),"err"); }
}
async function showDetail(id, rid){
  setBusy(true,"读取作业结构…");
  const r=await api("/api/show?id="+encodeURIComponent(id)+"&rid="+encodeURIComponent(rid));
  setBusy(false);
  if(!r.ok){ toast(r.error||"读取失败","err",4200); return; }
  const d=r.data||{}; const info=d.info||{}; const row=d.row||{}; const metas=d.metas||[]; const it=d.items||{};
  let html='<div class="kv" style="margin:0">'
    +'<div class="k">作业</div><div class="v">'+esc((info.name||row.name||id))+'</div>'
    +'<div class="k">ID / 资源</div><div class="v">'+esc(id)+' / '+esc(rid)+'</div>'
    +'<div class="k">得分</div><div class="v">'+esc(info.point!=null?info.point:"—")+' / '+esc(info.total_point||100)+'</div>'
    +'<div class="k">完成度</div><div class="v">'+esc(info.complete!=null?info.complete:0)+'%</div>'
    +'<div class="k">时长</div><div class="v">'+esc(info.use_time!=null?info.use_time:0)+'s</div>'
    +'<div class="k">通过线</div><div class="v">'+esc((row.pass_line!=null&&Number(row.pass_line)>0)?row.pass_line:"—（未设）")+'</div>'
    +'</div>';

  if(metas.length){
    html+='<div class="sect"><h4>提交条目（plat_data）</h4><div class="itemgrid">';
    for(const m of metas){
      html+='<div class="itemrow"><div><code>'+esc(m.item_id)+'</code><div class="t">'+esc(m.item_code)+'</div></div>'
        +'<div style="text-align:right"><div class="t">type '+esc(m.item_type)+' · 满分 '+esc(m.total_point)+'</div>'
        +'<div class="t">'+esc((m.orders||[]).map(o=>"#"+o.order+"("+o.total_point+"分)").join(" "))+'</div></div></div>';
    }
    html+='</div></div>';
  }
  if(it && it.sets && it.sets.length){
    html+='<div class="sect"><h4>资源结构 · '+esc(it.kind||"")+'</h4><div class="itemgrid">';
    for(const s of it.sets){
      html+='<div class="itemrow"><div><div>set '+esc(s.set_id)+'「'+esc(s.set_name)+'」</div>'
        +'<div class="t">'+esc((s.items||[]).map(i=>"entity "+i.entity_id+" · order "+i.order).join("  |  "))+'</div></div>'
        +'<div class="t" style="align-self:center">'+(s.items||[]).length+' 项</div></div>';
    }
    html+='</div></div>';
  }
  if(d.words && d.words.length){
    html+='<div class="sect"><h4>单词题 · '+d.words.length+' 题</h4><div class="itemgrid">';
    d.words.slice(0,12).forEach(q=>{ html+='<div class="itemrow"><div>'+esc(q.content||"")+'</div><div class="t">'+esc(q.phonetics||q.phonics||"")+'</div></div>'; });
    html+='</div></div>';
  }
  html+='<div class="sect"><h4>原始数据</h4><pre class="raw">'+esc(JSON.stringify({row, info},null,2).slice(0,4000))+'</pre></div>';
  $("#mTitle").textContent = (info.name||row.name||("作业 "+id));
  $("#mBody").innerHTML=html;
  $("#mask").classList.add("on");
}

/* ---------------- 事件 ---------------- */
$("#pctRange").addEventListener("input",(e)=>{
  $("#pctVal").textContent=e.target.value+"%";
  e.target.style.setProperty("--fill", (e.target.value-50)/50*100+"%");
});
$("#btnRefresh").addEventListener("click",()=>loadAll(false));
$("#btnTodo").addEventListener("click",submitTodo);
$("#btnClearLog").addEventListener("click",()=>{$("#log").innerHTML="";});
$("#dryChk").addEventListener("change",(e)=>{ if(e.target.checked) toast("dry-run：只预览，不会真的提交", "", 2600); });
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{ state.tab=Number(b.dataset.tab); renderTabs(); renderTable(); }));
$("#q").addEventListener("input",(e)=>{ state.q=e.target.value; renderTable(); });
$("#tableWrap").addEventListener("click",(e)=>{
  const tr=e.target.closest("tr"); if(!tr) return;
  const btn=e.target.closest("button");
  if(btn && btn.dataset.act){
    e.stopPropagation();
    const id=btn.dataset.id, rid=btn.dataset.rid;
    if(btn.dataset.act==="do") submitOne(id,rid,btn);
    else if(btn.dataset.act==="time") editTime(id,rid);
    else if(btn.dataset.act==="detail") showDetail(id,rid);
    return;
  }
  showDetail(tr.dataset.id, (rowsOf(state.tab).find(x=>String(x.id)===tr.dataset.id)||{}).resource_id);
});
$("#mClose").addEventListener("click",()=>$("#mask").classList.remove("on"));
$("#mask").addEventListener("click",(e)=>{ if(e.target.id==="mask") $("#mask").classList.remove("on"); });
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") $("#mask").classList.remove("on"); });

/* ---------------- 启动 ---------------- */
$("#pctRange").dispatchEvent(new Event("input"));
logLine("控制台已加载，正在连接 ETS…");
loadAll(false).then(()=>{
  const q=new URLSearchParams(location.search).get("open");
  if(q) showDetail(q, new URLSearchParams(location.search).get("rid") || undefined);
});
</script>
</body>
</html>
